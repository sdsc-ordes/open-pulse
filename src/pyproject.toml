[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "open-pulse"
version = "0.1.0"
description = "Open Pulse unified CLI and analysis toolkit."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Open Pulse Team" },
]
dependencies = [
  "typer>=0.15",
  "questionary>=2.1",
  "pydantic>=2.10",
  "pyyaml>=6.0",
  "python-dotenv>=1.1",
  "rich>=13.9",
]

[project.optional-dependencies]
grimoire-ui = [
  "streamlit>=1.41",
]

[project.scripts]
open-pulse = "open_pulse.cli:main"

[dependency-groups]
dev = [
  "ruff>=0.9.0",
]
test = [
  "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["open_pulse"]
