services:
  mariadb:
    image: mariadb:11.8
    restart: unless-stopped
    expose:
      - "3306"
    env_file:
      - path: ../.env
        required: false
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh", "--su=root", "--connect", "--innodb_initialized"]
      retries: 5
    volumes:
      - ${GRIMOIRE_DATA_DIR:-${OPEN_PULSE_DATA_DIR:-./data}/grimoirelab}/mariadb:/var/lib/mysql
    mem_limit: ${MARIADB_MEM_LIMIT:-512m}
    cpus: ${MARIADB_CPUS:-1.0}

  valkey:
    image: valkey/valkey:9
    restart: unless-stopped
    # SortingHat (server + worker) authenticate with SORTINGHAT_REDIS_PASSWORD,
    # so Valkey must require that same password — otherwise the worker's AUTH is
    # rejected ("AUTH called without any password configured"), it crash-loops,
    # and Mordred's identities/enrichment phase stalls.
    command: ["valkey-server", "--requirepass", "${SORTINGHAT_REDIS_PASSWORD:-replace-me}"]
    expose:
      - "6379"
    healthcheck:
      # Must authenticate now that requirepass is set, else the healthcheck fails
      # and sortinghat_worker's `depends_on: service_healthy` never releases.
      test: ["CMD", "valkey-cli", "-a", "${SORTINGHAT_REDIS_PASSWORD:-replace-me}", "--no-auth-warning", "--raw", "incr", "ping"]
      retries: 5
    volumes:
      - ${GRIMOIRE_DATA_DIR:-${OPEN_PULSE_DATA_DIR:-./data}/grimoirelab}/valkey:/data
    mem_limit: ${VALKEY_MEM_LIMIT:-256m}
    cpus: ${VALKEY_CPUS:-0.5}

  opensearch-node1:
    image: opensearchproject/opensearch:3
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch-node1
      - discovery.type=single-node
      - bootstrap.memory_lock=true  # along with the memlock settings below, disables swapping
      # JVM heap. Production guidance: set heap to ~50% of mem_limit, never above 31g.
      # Default below pairs `-Xms1g -Xmx1g` (in .env) with `mem_limit: 2g` to leave
      # ~1g for off-heap (Lucene buffers, native memory). Bump both together.
      - OPENSEARCH_JAVA_OPTS=${OPENSEARCH_JAVA_OPTS}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536  # maximum number of open files for the OpenSearch user, set to at least 65536 on modern systems
        hard: 65536
    ports:
      - 9200:9200
      - 9600:9600  # required for Performance Analyzer
    volumes:
      - ${GRIMOIRE_DATA_DIR:-${OPEN_PULSE_DATA_DIR:-./data}/grimoirelab}/opensearch-data:/usr/share/opensearch/data
    healthcheck:
      # Cluster `yellow` is fine for a single-node deploy (replicas can't be
      # allocated without a 2nd node); only `red` is unhealthy.
      test:
        - CMD-SHELL
        - >-
          curl -sk -u "admin:${OPENSEARCH_INITIAL_ADMIN_PASSWORD:-admin}"
          'https://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s'
          | grep -E '"status":"(yellow|green)"' >/dev/null
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    mem_limit: ${OPENSEARCH_MEM_LIMIT:-2g}
    cpus: ${OPENSEARCH_CPUS:-2.0}

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    ports:
      - 5601:5601
    depends_on:
      opensearch-node1:
        condition: service_healthy
    healthcheck:
      # OpenSearch Dashboards v3 requires auth on /api/status (returns 401),
      # so we use a liveness probe instead: GET / returns 302 redirect when
      # the server is up, which is enough to confirm the process is serving
      # HTTP. Anything in the 2xx/3xx range is healthy; 4xx (apart from 401
      # on /) or 5xx fails.
      test:
        - CMD-SHELL
        - >-
          code=$$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5601/);
          [ "$$code" -ge 200 ] && [ "$$code" -lt 400 ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    mem_limit: ${DASHBOARDS_MEM_LIMIT:-768m}
    cpus: ${DASHBOARDS_CPUS:-1.0}

  prepare-grimoire-config:
    image: python:3.11-alpine
    restart: "no"
    working_dir: /workspace
    command:
      - python
      - /workspace/python-scripts/render_setup_cfg.py
    env_file:
      - path: ../.env
        required: false
    environment:
      - SETUP_CFG_TEMPLATE_PATH=/workspace/templates/setup.cfg.template
      - PROJECTS_JSON_PATH=/workspace/input/projects.json
      - RENDERED_CONFIG_DIR=/workspace/output
    volumes:
      - ./grimoirelab/python-scripts:/workspace/python-scripts:ro
      - ./grimoirelab/config/setup.cfg.template:/workspace/templates/setup.cfg.template:ro
      - ./grimoirelab/config/projects.json:/workspace/input/projects.json:ro
      - ${GRIMOIRE_DATA_DIR:-${OPEN_PULSE_DATA_DIR:-./data}/grimoirelab}/projects-conf:/workspace/output

  prepare-opensearch:
    image: alpine:3.21
    restart: on-failure:3
    working_dir: /workspace
    command:
      - /bin/sh
      - -c
      - apk add --no-cache bash curl >/dev/null && bash /workspace/scripts/prepare-opensearch.sh
    volumes:
      - ./grimoirelab/scripts:/workspace/scripts:ro
      - ./grimoirelab/config/sigils:/workspace/config/sigils:ro
    env_file:
      - path: ../.env
        required: false
    environment:
      - SCRIPTS_DIR=/workspace/scripts
      - SIGILS_DIR=/workspace/config/sigils
    depends_on:
      - opensearch-node1
      - opensearch-dashboards

  mordred:
    # Pinned name so the projects-applier sidecar's `docker restart
    # open-pulse-mordred` (default for MORDRED_CONTAINER_NAME) hits this
    # container after writing a new projects.json. Without it, compose
    # generates `<project>-mordred-1` and the restart silently fails.
    container_name: open-pulse-mordred
    restart: on-failure:5
    image: grimoirelab/grimoirelab:latest
    # Override the upstream healthcheck — its `healthcheck.py` scans the log
    # file synchronously and routinely takes >6s, so docker keeps reporting
    # `unhealthy` even when collection / enrichment is running fine. We
    # check that the sirmordred process is still alive instead; restarts on
    # crashloop catch the actual failure mode.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -af sirmordred >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    env_file:
      - path: ../.env
        required: false
    environment:
      - TMPDIR=/home/grimoire/tmp
    volumes:
      - ${GRIMOIRE_DATA_DIR:-${OPEN_PULSE_DATA_DIR:-./data}/grimoirelab}/projects-conf:/home/grimoire/conf:ro
      - ${GRIMOIRE_DATA_DIR:-${OPEN_PULSE_DATA_DIR:-./data}/grimoirelab}/mordred/logs:/home/grimoire/logs
      - ${GRIMOIRE_DATA_DIR:-${OPEN_PULSE_DATA_DIR:-./data}/grimoirelab}/mordred/perceval:/home/grimoire/.perceval
      - ${GRIMOIRE_DATA_DIR:-${OPEN_PULSE_DATA_DIR:-./data}/grimoirelab}/mordred/cache:/home/grimoire/.cache
      - ${GRIMOIRE_DATA_DIR:-${OPEN_PULSE_DATA_DIR:-./data}/grimoirelab}/mordred/tmp:/home/grimoire/tmp
    depends_on:
      prepare-grimoire-config:
        condition: service_completed_successfully
      nginx:
        condition: service_healthy
    mem_limit: ${MORDRED_MEM_LIMIT:-2g}
    cpus: ${MORDRED_CPUS:-2.0}

  sortinghat:
    restart: on-failure:3
    image: grimoirelab/sortinghat
    env_file:
      - path: ../.env
        required: false
    expose:
      - "9314"
    volumes:
      - ${GRIMOIRE_DATA_DIR:-${OPEN_PULSE_DATA_DIR:-./data}/grimoirelab}/sortinghat/static:/opt/venv/lib/python3.12/site-packages/sortinghat/static/
    depends_on:
      mariadb:
        condition: service_healthy
      valkey:
        condition: service_healthy
    mem_limit: ${SORTINGHAT_MEM_LIMIT:-512m}
    cpus: ${SORTINGHAT_CPUS:-1.0}

  sortinghat_worker:
    restart: unless-stopped
    image: grimoirelab/sortinghat-worker
    env_file:
      - path: ../.env
        required: false
    depends_on:
      mariadb:
        condition: service_healthy
      valkey:
        condition: service_healthy
    mem_limit: ${SORTINGHAT_WORKER_MEM_LIMIT:-384m}
    cpus: ${SORTINGHAT_WORKER_CPUS:-1.0}

  nginx:
    restart: on-failure:3
    image: nginx:latest
    env_file:
      - path: ../.env
        required: false
    volumes:
      - ./grimoirelab/config/nginx.conf.template:/etc/nginx/templates/default.conf.template
      - ./grimoirelab/config/uwsgi_params:/etc/nginx/uwsgi_params
      - ${GRIMOIRE_DATA_DIR:-${OPEN_PULSE_DATA_DIR:-./data}/grimoirelab}/sortinghat/static:/sortinghat:ro
    ports:
      - 7508:8000  # PORT EDIT needs to be here to expose on a different port.
    depends_on:
      - sortinghat
    healthcheck:
      test: "curl -s --head http://localhost:8000/identities/api/ | grep Set-Cookie || exit 1"
      retries: 5
    mem_limit: ${GRIMOIRE_NGINX_MEM_LIMIT:-128m}
    cpus: ${GRIMOIRE_NGINX_CPUS:-0.5}

  # ── projects.json applier sidecar ─────────────────────────────────────
  # Backend for the dashboard UI. Receives projects.json from the browser,
  # writes it to the shared projects-conf bind dir (read by mordred), then
  # calls `docker restart` on the mordred container so the new config picks up.
  projects-applier:
    restart: unless-stopped
    # Image-only ref — build the applier from this repo's source with:
    #   docker build -t open-pulse-applier:local infra/open-pulse-stack/grimoirelab/applier
    # then set OPEN_PULSE_APPLIER_IMAGE in .env, otherwise the published
    # GHCR tag is pulled.
    image: "${OPEN_PULSE_APPLIER_IMAGE:-ghcr.io/sdsc-ordes/open-pulse-applier:latest}"
    env_file:
      - path: ../.env
        required: false
    environment:
      - APPLIER_AUTH=${APPLIER_AUTH:?APPLIER_AUTH must be set in .env}
      - MORDRED_CONTAINER_NAME=${MORDRED_CONTAINER_NAME:-open-pulse-mordred}
      - CONF_DIR=/conf
    volumes:
      - ${GRIMOIRE_DATA_DIR:-${OPEN_PULSE_DATA_DIR:-./data}/grimoirelab}/projects-conf:/conf
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${APPLIER_PORT:-1235}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    mem_limit: ${APPLIER_MEM_LIMIT:-256m}
    cpus: ${APPLIER_CPUS:-0.5}
