services:
  neo4j:
    image: neo4j:2025.05.1
    container_name: neo4j-open-pulse
    restart: unless-stopped
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: "${NEO4J_AUTH:-neo4j/replace-me}"
      NEO4J_PLUGINS: '${NEO4J_PLUGINS:-["graph-data-science","apoc"]}'
      NEO4J_dbms_security_procedures_unrestricted: "${NEO4J_UNRESTRICTED:-apoc.*}"
      NEO4J_dbms_security_procedures_allowlist: "${NEO4J_ALLOWLIST:-apoc.*}"
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      # JVM heap + page cache. Production guidance: heap ≤ 50% of mem_limit so
      # the rest is available for off-heap (page cache, GC overhead, native).
      # Defaults below pair with `mem_limit: 2g`.
      NEO4J_server_memory_heap_initial__size: "${NEO4J_HEAP:-1g}"
      NEO4J_server_memory_heap_max__size: "${NEO4J_HEAP:-1g}"
      NEO4J_server_memory_pagecache_size: "${NEO4J_PAGECACHE:-512m}"
    volumes:
      - ${OPEN_PULSE_DATA_DIR:-./data}/neo4j/logs:/logs
      - ${OPEN_PULSE_DATA_DIR:-./data}/neo4j/config:/config
      - ${OPEN_PULSE_DATA_DIR:-./data}/neo4j/data:/data
      - ${OPEN_PULSE_DATA_DIR:-./data}/neo4j/plugins:/plugins
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u neo4j -p $${NEO4J_AUTH#*/} 'RETURN 1' >/dev/null 2>&1 || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    mem_limit: ${NEO4J_MEM_LIMIT:-2g}
    cpus: ${NEO4J_CPUS:-2.0}

  grimoirelab-db:
    image: postgres:16-alpine
    container_name: grimoirelab-db
    profiles:
      - grimoirelab
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${GRIMOIRELAB_DB_USER:-openpulse}"
      POSTGRES_PASSWORD: "${GRIMOIRELAB_DB_PASSWORD:-replace-me}"
      POSTGRES_DB: "${GRIMOIRELAB_DB_NAME:-grimoirelab}"
    volumes:
      - ${OPEN_PULSE_DATA_DIR:-./data}/grimoirelab-db:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    mem_limit: ${GRIMOIRELAB_DB_MEM_LIMIT:-384m}
    cpus: ${GRIMOIRELAB_DB_CPUS:-1.0}

  grimoirelab-worker:
    image: alpine:3.20
    container_name: grimoirelab-worker
    profiles:
      - grimoirelab
    depends_on:
      grimoirelab-db:
        condition: service_healthy
    command: ["sh", "-c", "echo GrimoireLab profile enabled; sleep infinity"]
    mem_limit: ${GRIMOIRELAB_WORKER_MEM_LIMIT:-128m}
    cpus: ${GRIMOIRELAB_WORKER_CPUS:-0.5}

  portainer:
    image: portainer/portainer-ce
    container_name: portainer
    profiles:
      - orchestration
    restart: unless-stopped
    ports:
      - "${PORTAINER_PORT:-7508}:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${OPEN_PULSE_DATA_DIR:-./data}/portainer:/data
    command: --admin-password "${PORTAINER_HASHED_PASSWORD:-$$2y$$10$$replace-with-bcrypt-hash}"
    mem_limit: ${PORTAINER_MEM_LIMIT:-256m}
    cpus: ${PORTAINER_CPUS:-0.5}

  crawler:
    image: ${CRAWLER_IMAGE:-ghcr.io/sdsc-ordes/open-pulse-crawler:latest}
    container_name: open-pulse-crawler
    profiles:
      - crawler
    # Pull the deployment env so any per-service knob set in infra/.env
    # reaches the container without an explicit mapping in `environment:`.
    env_file:
      - path: ../.env
        required: false
    environment:
      # Defaults are empty so other profiles can be brought up without these
      # set. The crawler container fails fast on first request when either
      # is empty — keep the validation in the service, not in compose's
      # parse-time interpolation (which fires for every profile).
      API_TOKEN: "${CRAWLER_API_TOKEN:-}"
      # GitHub PAT(s). Renamed from ``GITHUB_TOKEN`` to the
      # ``CRAWLER_*`` namespace so it stops shadowing the gh CLI's
      # magic ``GITHUB_TOKEN`` env (same motivation as the GME rename
      # in Imaging-Plaza/git-metadata-extractor PR #57). The
      # ``_POOL`` variant carries the full comma-separated list used
      # by the round-robin; the bare ``CRAWLER_GITHUB_TOKEN`` is the
      # single-PAT fallback used by legacy / external lib call sites
      # that 401 on commas.
      CRAWLER_GITHUB_TOKEN: "${CRAWLER_GITHUB_TOKEN:-}"
      CRAWLER_GITHUB_TOKEN_POOL: "${CRAWLER_GITHUB_TOKEN:-}"
      # Bridge for the pr-9 crawler image, which still reads ``GITHUB_TOKEN``
      # in ``open_pulse_crawler/api.py`` (lines 549, 649) and aborts jobs
      # with "GITHUB_TOKEN environment variable is not set" if it is empty.
      # Until the image is updated to honor the ``CRAWLER_*`` rename above,
      # forward the same PAT under both names. Remove once the image picks
      # up the rename and re-reads ``CRAWLER_GITHUB_TOKEN_POOL`` directly.
      GITHUB_TOKEN: "${CRAWLER_GITHUB_TOKEN:-}"
      # The pr-9 image's API cache (``open_pulse_crawler/github_client.py``)
      # defaults to a relative ``data/open-pulse-crawler/cache`` path, which
      # the ``app`` user cannot create under cwd ``/app`` (owned by root).
      # Without this override, every GraphQL crawl aborts with
      # ``PermissionError: [Errno 13] Permission denied: 'data'`` before a
      # single request is issued. Pointing the cache at /tmp keeps the
      # speedup of cross-job request memoization without needing a mounted
      # volume — the trade-off is the cache evaporates on container restart.
      OPC_CACHE_DIR: "/tmp/open-pulse-crawler/cache"
    ports:
      - "${CRAWLER_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: ${CRAWLER_MEM_LIMIT:-768m}
    cpus: ${CRAWLER_CPUS:-1.0}

  git-metadata-extractor:
    image: ${EXTRACTOR_IMAGE:-ghcr.io/imaging-plaza/git-metadata-extractor:latest}
    container_name: git-metadata-extractor
    profiles:
      - extractor
    restart: unless-stopped
    depends_on:
      selenium:
        condition: service_healthy
      gme-qdrant:
        condition: service_healthy
    # Pull the deployment env so V2_*, RCP_TOKEN, OPENALEX_MAILTO, HF_TOKEN,
    # EPFL_GRAPH_*, ORCID_*, INDEX_QDRANT_URL, GRIMOIRE_GITHUB_TOKEN — and
    # any other per-service knob set in infra/.env — reach the container
    # without needing an explicit mapping in `environment:`.
    env_file:
      - path: ../.env
        required: false
    environment:
      # The v2 extract path refuses to operate (HTTP 503 "Auth not
      # configured: API_TOKEN is unset") if API_TOKEN is empty server-side.
      # Mirror the crawler's pattern: pull a dedicated env var. The
      # open-pulse client doesn't actually send a bearer, but the server
      # requires this be set as a self-check.
      API_TOKEN: "${EXTRACTOR_API_TOKEN:-}"
      # At least one LLM provider must be set; the app picks based on PROVIDER.
      OPENAI_API_KEY: "${EXTRACTOR_OPENAI_API_KEY:-}"
      OPENROUTER_API_KEY: "${EXTRACTOR_OPENROUTER_API_KEY:-}"
      # See the crawler block above — soft default keeps other profiles
      # buildable. Extractor itself errors when this is empty.
      #
      # GME_GITHUB_TOKEN: comma-separated PATs for the GitHub call sites
      # the GME makes (REST + GraphQL + gimie). The extractor's
      # ``src/api.py`` startup runs ``_normalize_github_token_pool()``
      # before any worker imports: it parses the comma list, exports
      # ``GME_GITHUB_TOKEN_POOL=<full list>`` for the round-robin pool,
      # and overwrites ``GME_GITHUB_TOKEN=<first token>`` for legacy
      # single-token consumers (gimie, validate_github_token). With N
      # PATs the effective GraphQL ceiling is N × 5 000 pts/h.
      #
      # Renamed from ``GITHUB_TOKEN`` in upstream PR #57 — gh CLI
      # treats ``GITHUB_TOKEN`` as a magic env that overrides
      # ``gh auth login``, so the GME_ namespace lets the two coexist
      # in the devcontainer / admin shells.
      #
      # Note: do NOT inject ``GME_GITHUB_TOKEN_POOL`` from here — the
      # app derives it. Setting it externally risks it drifting out of
      # sync with ``GME_GITHUB_TOKEN`` after a future restart.
      GME_GITHUB_TOKEN: "${EXTRACTOR_GITHUB_TOKEN:-}"
      GITLAB_TOKEN: "${EXTRACTOR_GITLAB_TOKEN:-}"
      INFOSCIENCE_TOKEN: "${EXTRACTOR_INFOSCIENCE_TOKEN:-}"
      MODEL: "${EXTRACTOR_MODEL:-gpt-4o-mini}"
      PROVIDER: "${EXTRACTOR_PROVIDER:-openai}"
      SELENIUM_REMOTE_URL: "http://selenium:4444/wd/hub"
      CACHE_DB_PATH: "/app/data/api_cache.db"
      # Per-provider RAG indices (openalex, zenodo, hf, ror, …) — bind-mounted
      # below at /app/index so they live alongside qdrant/storage as a peer
      # under OPEN_PULSE_DATA_DIR (not nested under /app/data).
      INDEX_DATA_DIR: "/app/index"
      MAX_CACHE_ENTRIES: "${EXTRACTOR_MAX_CACHE_ENTRIES:-5000}"
      MAX_SELENIUM_SESSIONS: "${EXTRACTOR_MAX_SELENIUM_SESSIONS:-1}"
      WORKERS: "${EXTRACTOR_WORKERS:-2}"
      # The v2 path defaults to mock providers, which need test fixtures that
      # aren't shipped in the runtime image. Override to use real providers
      # (which call GitHub via GITHUB_TOKEN above).
      V2_USE_MOCK_PROVIDERS: "${EXTRACTOR_USE_MOCK_PROVIDERS:-false}"
    ports:
      - "${EXTRACTOR_PORT:-1234}:1234"
    volumes:
      # Sqlite cache (api_cache.db etc.) — bound at /app/data per
      # CACHE_DB_PATH above. Drop a previous run's api_cache.db at
      # ${OPEN_PULSE_DATA_DIR}/extractor/api_cache.db to skip warm-up.
      - ${OPEN_PULSE_DATA_DIR:-./data}/extractor:/app/data
      # V2 RAG provider cache. V2_PROVIDER_CACHE_PATH is `.cache/v2/providers.db`
      # relative to the extractor's working dir (/app), so the file lives at
      # /app/.cache/v2/providers.db inside the container. Persist it on the
      # host so the cache survives container recreation. Drop a previous
      # run's providers.db at ${OPEN_PULSE_DATA_DIR}/extractor-cache/v2/.
      - ${OPEN_PULSE_DATA_DIR:-./data}/extractor-cache:/app/.cache
      # Per-provider RAG indices the V2 path reads from. INDEX_DATA_DIR
      # above points the extractor here; the on-disk layout (subdir per
      # provider: openalex, zenodo, hf, ror, etc.) matches what gme writes.
      - ${OPEN_PULSE_DATA_DIR:-./data}/index:/app/index
    healthcheck:
      # The extractor doesn't expose a dedicated /healthz; GET / returns the API
      # root and is the only system-level endpoint defined in src/api.py.
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:1234/', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: ${EXTRACTOR_MEM_LIMIT:-1536m}
    cpus: ${EXTRACTOR_CPUS:-2.0}

  # Vector store the extractor's V2 RAG path talks to. Container name
  # `gme-qdrant` matches the default INDEX_QDRANT_URL (http://gme-qdrant:6333)
  # the extractor expects. Bind-mount layout matches the gme repo's own
  # devcontainer compose so on-disk Qdrant data is portable between the two.
  gme-qdrant:
    image: qdrant/qdrant:latest
    container_name: gme-qdrant
    profiles:
      - extractor
    restart: unless-stopped
    expose:
      - "6333"
      - "6334"
    volumes:
      - ${OPEN_PULSE_DATA_DIR:-./data}/qdrant/storage:/qdrant/storage
    healthcheck:
      # The qdrant image has no curl/wget. bash is present and supports the
      # /dev/tcp pseudo-device, so we just verify the API port accepts TCP.
      # start_period is generous because qdrant blocks the listener until
      # every collection's shards are recovered from disk; with the user's
      # ~30 collections that takes 60–120s on first start.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/6333"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 180s
    mem_limit: ${QDRANT_MEM_LIMIT:-1g}
    cpus: ${QDRANT_CPUS:-1.0}

  selenium:
    image: selenium/standalone-chromium:latest
    container_name: open-pulse-selenium
    profiles:
      - extractor
    restart: unless-stopped
    shm_size: "2gb"
    expose:
      - "4444"
    environment:
      SE_NODE_MAX_SESSIONS: "${EXTRACTOR_MAX_SELENIUM_SESSIONS:-1}"
      SE_NODE_OVERRIDE_MAX_SESSIONS: "true"
    healthcheck:
      test: ["CMD", "/opt/bin/check-grid.sh", "--host", "0.0.0.0", "--port", "4444"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: ${SELENIUM_MEM_LIMIT:-1g}
    cpus: ${SELENIUM_CPUS:-1.0}

  oxigraph:
    image: ghcr.io/oxigraph/oxigraph:0.4.7
    container_name: oxigraph-open-pulse
    profiles:
      - sparql
    restart: unless-stopped
    # No host port — only the sparql-proxy is reachable from the host. Oxigraph
    # is reachable from other containers on the compose network as `oxigraph:7878`.
    expose:
      - "7878"
    command:
      - "serve"
      - "--location=/data"
      - "--bind=0.0.0.0:7878"
    volumes:
      - ${OPEN_PULSE_DATA_DIR:-./data}/oxigraph:/data
    # No healthcheck — the official Oxigraph image is distroless (no /bin/sh,
    # no wget/curl). The sparql-proxy waits on `service_started` and Caddy
    # retries the upstream on its own until Oxigraph is accepting connections.
    mem_limit: ${OXIGRAPH_MEM_LIMIT:-1g}
    cpus: ${OXIGRAPH_CPUS:-1.0}

  sparql-proxy:
    image: caddy:2.8-alpine
    container_name: sparql-proxy-open-pulse
    profiles:
      - sparql
    restart: unless-stopped
    depends_on:
      oxigraph:
        condition: service_started
    ports:
      - "${SPARQL_PROXY_PORT:-7878}:7878"
    environment:
      # Paths to protect with the reader/admin Basic Auth block in the
      # Caddyfile. Default is **read-gated** so the YASGUI UI on
      # ``/`` and the ``/query`` endpoint require the admin credential
      # (``SPARQL_AUTH``) — or a reader credential when
      # ``SPARQL_READER_AUTH`` is set. Override to ``__off__`` in
      # ``infra/.env`` to expose reads anonymously (matches no path).
      SPARQL_READ_AUTH_PATHS: "${SPARQL_READ_AUTH_PATHS:-/ /query /query/*}"
    volumes:
      - ../services/sparql-proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../services/sparql-proxy/users:/etc/caddy/users:ro
      - ../services/sparql-proxy/projects-ui:/etc/caddy/projects-ui:ro
      - ${OPEN_PULSE_DATA_DIR:-./data}/sparql-proxy/data:/data
      - ${OPEN_PULSE_DATA_DIR:-./data}/sparql-proxy/config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7878/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    mem_limit: ${SPARQL_PROXY_MEM_LIMIT:-128m}
    cpus: ${SPARQL_PROXY_CPUS:-0.5}

  # ── Open Pulse Hub: control-plane dashboard (opt-in via --profile hub) ──
  # Same image as the CLI / orchestrator container — built from
  # tools/images/Dockerfile-open-pulse. The hub role is selected by overriding
  # `command:` to `gui hub serve …`. Pin a tag via OPEN_PULSE_IMAGE.
  hub:
    image: "${OPEN_PULSE_IMAGE:-ghcr.io/sdsc-ordes/open-pulse:latest}"
    command: ["gui", "hub", "serve", "--host", "0.0.0.0", "--port", "8000"]
    container_name: open-pulse-hub
    profiles:
      - hub
    restart: unless-stopped
    ports:
      - "${HUB_PORT:-9090}:8000"
    # Pull the deployment env so any per-service knob set in infra/.env
    # reaches the container without needing an explicit mapping below.
    env_file:
      - path: ../.env
        required: false
    environment:
      HUB_AUTH: "${HUB_AUTH:?HUB_AUTH must be set in infra/.env (e.g. openssl rand -base64 32 | tr '+/' '-_' | tr -d '=')}"
      HUB_DATA_DIR: /data/hub
      HUB_APPLIER_URL: "${HUB_APPLIER_URL:-http://projects-applier:8000}"
      HUB_SPARQL_URL: "${HUB_SPARQL_URL:-http://sparql-proxy:7878}"
      HUB_NEO4J_URL: "${HUB_NEO4J_URL:-bolt://neo4j:7687}"
      HUB_KIBITER_URL: "${HUB_KIBITER_URL:-http://${HUB_PUBLIC_HOST:-localhost}:7508}"
      # Single host knob the URL defaults below derive from. Override individual
      # HUB_*_BROWSER_URL / HUB_*_DOCS_URL values to bypass this.
      HUB_PUBLIC_HOST: "${HUB_PUBLIC_HOST:-localhost}"
      # OpenSearch (used by /api/databases/opensearch/* and the marquee stats)
      HUB_OPENSEARCH_URL: "${HUB_OPENSEARCH_URL:-https://opensearch-node1:9200}"
      HUB_OPENSEARCH_USERNAME: "${HUB_OPENSEARCH_USERNAME:-${OPENSEARCH_USERNAME:-admin}}"
      HUB_OPENSEARCH_PASSWORD: "${HUB_OPENSEARCH_PASSWORD:-${OPENSEARCH_PASSWORD:-}}"
      HUB_OPENSEARCH_VERIFY_TLS: "${HUB_OPENSEARCH_VERIFY_TLS:-false}"
      # Crawler in-network URL + bearer token used by /api/crawler/* proxies
      HUB_CRAWLER_URL: "${HUB_CRAWLER_URL:-http://crawler:8000}"
      CRAWLER_API_TOKEN: "${CRAWLER_API_TOKEN:-}"
      # Server-side defaults for the GrimoireLab applier + SPARQL store auth.
      # The browser's Settings page can override these per-user (Settings
      # localStorage wins on the request); for the local stack the user
      # doesn't need to type anything.
      APPLIER_AUTH: "${APPLIER_AUTH:-}"
      SPARQL_AUTH: "${SPARQL_AUTH:-}"
      # Used by /api/projects/build-by-owner to query Neo4j directly.
      NEO4J_AUTH: "${NEO4J_AUTH:-}"
      # User-facing dashboard URLs (host-published ports / external links).
      # Default to HUB_PUBLIC_HOST so an operator only has to set one var;
      # set an explicit URL here to override on a per-service basis.
      HUB_NEO4J_BROWSER_URL: "${HUB_NEO4J_BROWSER_URL:-http://${HUB_PUBLIC_HOST:-localhost}:7503}"
      HUB_SPARQL_BROWSER_URL: "${HUB_SPARQL_BROWSER_URL:-http://${HUB_PUBLIC_HOST:-localhost}:7502}"
      HUB_OPENSEARCH_DASHBOARDS_URL: "${HUB_OPENSEARCH_DASHBOARDS_URL:-http://${HUB_PUBLIC_HOST:-localhost}:7508}"
      HUB_ONTOLOGY_URL: "${HUB_ONTOLOGY_URL:-https://sdsc-ordes.github.io/open-pulse-ontology/versions/v2.1.2/index.html}"
      # Swagger UIs are proxied through the hub (auth-gated) by default, so
      # the upstream pages don't need to be reachable anonymously. Set a full
      # URL to bypass the hub proxy.
      HUB_CRAWLER_DOCS_URL: "${HUB_CRAWLER_DOCS_URL:-/api/crawler/docs}"
      HUB_EXTRACTOR_DOCS_URL: "${HUB_EXTRACTOR_DOCS_URL:-/api/extractor/docs}"
      # Public URL Swagger UI's "Try it out" hits — used in the rewritten
      # `servers` field. Defaults to ${HUB_PUBLIC_HOST}:${PORT}.
      HUB_CRAWLER_PUBLIC_URL: "${HUB_CRAWLER_PUBLIC_URL:-}"
      HUB_EXTRACTOR_PUBLIC_URL: "${HUB_EXTRACTOR_PUBLIC_URL:-}"
      # Used by the openapi proxy to fetch the spec in-network.
      HUB_EXTRACTOR_URL: "${HUB_EXTRACTOR_URL:-http://git-metadata-extractor:1234}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${OPEN_PULSE_DATA_DIR:-./data}/hub:/data/hub
      - ${OPEN_PULSE_DATA_DIR:-./data}:/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: ${HUB_MEM_LIMIT:-512m}
    cpus: ${HUB_CPUS:-1.0}

  # ── edge-proxy ───────────────────────────────────────────────────────
  # Public TLS-terminating reverse proxy for openpulse.epfl.ch.
  #
  # Listens on 80 + 443 (the only two ports the EPFL DMZ opens for public
  # browser traffic — every other 75xx port is restricted to operators on
  # the EPFL net / VPN) and forwards every request to the hub. The hub
  # already implements path-prefixed proxies for the crawler API
  # (`/api/crawler/*`) and the metadata extractor (`/api/extractor/*`),
  # so there's no per-service routing here — one reverse_proxy block
  # gives external users the whole control plane under one URL.
  #
  # Caddy auto-obtains a Let's Encrypt certificate via HTTP-01 challenge
  # on port 80 (DNS resolves openpulse.epfl.ch to this host's public
  # IP). Cert state lives in /data, mounted as a host volume so renewals
  # survive container recreates.
  #
  # Profile: `edge`. Bring up alongside the rest with
  # `docker compose --profile edge --profile hub --profile crawler … up -d`.
  edge-proxy:
    image: caddy:2.8-alpine
    container_name: openpulse-edge-proxy
    profiles:
      - edge
    restart: unless-stopped
    # No depends_on: the hub lives in the `hub` profile, so compose
    # can't validate the link when only `--profile edge` is active.
    # Caddy retries upstream connections automatically — if the hub is
    # down the proxy returns 502 until it's back, which is what we want.
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ../services/edge-proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${OPEN_PULSE_DATA_DIR:-./data}/edge-proxy/data:/data
      - ${OPEN_PULSE_DATA_DIR:-./data}/edge-proxy/config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: ${EDGE_PROXY_MEM_LIMIT:-128m}
    cpus: ${EDGE_PROXY_CPUS:-0.5}
