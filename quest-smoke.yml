quest:
  name: smoke-crawler
  retry:
    max_attempts: 1
    backoff_seconds: 0
  services:
    crawler:
      endpoint: http://host.docker.internal:8000
      api_token_env: CRAWLER_API_TOKEN
    neo4j:
      endpoint: bolt://host.docker.internal:7687
      auth_env: NEO4J_AUTH
    metadata_extractor:
      endpoint: http://host.docker.internal:1234
    sparql_store:
      endpoint: http://host.docker.internal:7878
      auth_env: SPARQL_AUTH
  steps:
    crawler:
      seeds: ["sdsc-ordes/gimie"]
      max_rounds: 1
      poll_interval_seconds: 5.0
      timeout_seconds: 1800.0
    neo4j_upload: { enabled: true }
    metadata_extractor:
      enabled: true
      max_repos: 3
      force_refresh: false
    sparql_upload:
      enabled: true
