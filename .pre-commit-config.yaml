repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
        args: [--config, analysis/pyproject.toml]
        files: ^analysis/
      - id: ruff-format
        args: [--config, analysis/pyproject.toml]
        files: ^analysis/

  # Optional markdown linting; remove this block if not needed locally.
  - repo: https://github.com/pre-commit/mirrors-markdownlint
    rev: v0.39.0
    hooks:
      - id: markdownlint
