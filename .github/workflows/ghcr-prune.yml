name: GHCR Prune

on:
  schedule:
    - cron: "0 3 * * 0"  # Sundays 03:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print what would be deleted without deleting (default: true)."
        type: boolean
        default: true
      prune_sha_now:
        description: "Ignore the sha-* age grace and prune all sha-only tagged versions immediately."
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  pull-requests: read

env:
  ORG: sdsc-ordes
  # Grace periods so an in-flight build or a just-closed PR isn't pruned mid-run.
  PR_TAG_AGE_DAYS: "7"
  UNTAGGED_AGE_DAYS: "14"
  # `sha-<short>` tags are no longer produced by docker-publish.yml; this
  # grace period lets the prune sweep up legacy sha-tagged versions whose
  # only label is the sha (i.e. not also tagged `latest`/branch/version).
  SHA_TAG_AGE_DAYS: "30"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ghcr-prune
  cancel-in-progress: false

jobs:
  prune:
    name: Prune ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One job per package — independent failures don't stop the others, and
    # each gets its own summary panel. Add new packages by extending this list.
    strategy:
      fail-fast: false
      matrix:
        package:
          - open-pulse
          - open-pulse-applier
    steps:
      - name: Prune package versions
        uses: actions/github-script@v9
        env:
          PACKAGE_NAME: ${{ matrix.package }}
        with:
          script: |
            const org = process.env.ORG;
            const packageName = process.env.PACKAGE_NAME;
            const prAgeMs = Number(process.env.PR_TAG_AGE_DAYS) * 86_400_000;
            const untaggedAgeMs = Number(process.env.UNTAGGED_AGE_DAYS) * 86_400_000;
            const shaAgeMs = Number(process.env.SHA_TAG_AGE_DAYS) * 86_400_000;

            // Cron always applies; manual runs default to dry-run unless the
            // user explicitly sets dry_run=false.
            let shouldDelete;
            let pruneShaNow = false;
            if (context.eventName === 'workflow_dispatch') {
              const raw = String(context.payload.inputs?.dry_run ?? 'true').toLowerCase();
              shouldDelete = raw === 'false';
              const rawSha = String(context.payload.inputs?.prune_sha_now ?? 'false').toLowerCase();
              pruneShaNow = rawSha === 'true';
            } else {
              shouldDelete = true;
            }

            const now = Date.now();
            let scanned = 0, deleted = 0, skipped = 0, failed = 0;

            const iterator = github.paginate.iterator(
              github.rest.packages.getAllPackageVersionsForPackageOwnedByOrg,
              {
                package_type: 'container',
                package_name: packageName,
                org,
                per_page: 100,
              }
            );

            // Cache PR lookups so we don't re-call pulls.get for the same PR
            // when both the manifest list and its platform children are in the
            // result set.
            const prStateCache = new Map();

            for await (const { data: versions } of iterator) {
              for (const version of versions) {
                scanned++;
                const ageMs = now - new Date(version.updated_at).getTime();
                const tags = version.metadata?.container?.tags ?? [];
                const prTag = tags.find(t => /^pr-\d+$/.test(t));
                const shaTags = tags.filter(t => /^sha-[0-9a-f]+$/i.test(t));
                const isShaOnly = tags.length > 0 && shaTags.length === tags.length;

                let reason = null;

                if (prTag) {
                  if (ageMs < prAgeMs) { skipped++; continue; }
                  const prNumber = Number(prTag.slice(3));
                  let prState = prStateCache.get(prNumber);
                  if (prState === undefined) {
                    try {
                      const { data: pr } = await github.rest.pulls.get({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        pull_number: prNumber,
                      });
                      prState = pr.state;
                    } catch (err) {
                      prState = 'missing';
                    }
                    prStateCache.set(prNumber, prState);
                  }
                  if (prState === 'open') { skipped++; continue; }
                  reason = prState === 'missing'
                    ? `PR #${prNumber} not found`
                    : `PR #${prNumber} closed`;
                } else if (isShaOnly) {
                  // Legacy `sha-<short>` tag with no other label co-pointing
                  // at this digest. docker-publish.yml no longer emits these.
                  if (!pruneShaNow && ageMs < shaAgeMs) { skipped++; continue; }
                  reason = pruneShaNow
                    ? 'sha-* legacy tag (prune_sha_now)'
                    : 'sha-* legacy tag';
                } else if (tags.length === 0) {
                  if (ageMs < untaggedAgeMs) { skipped++; continue; }
                  reason = 'untagged';
                } else {
                  // Protected tag (latest, branch, version, or sha-* shared
                  // with one of those) — never touch from the prune job.
                  skipped++;
                  continue;
                }

                const ageDays = (ageMs / 86_400_000).toFixed(1);
                const tagsStr = tags.length ? tags.join(', ') : '(untagged)';
                const action = shouldDelete ? 'DELETE' : 'DRY-RUN';
                console.log(`${action} id=${version.id} [${tagsStr}] age=${ageDays}d — ${reason}`);

                if (shouldDelete) {
                  try {
                    await github.rest.packages.deletePackageVersionForOrg({
                      package_type: 'container',
                      package_name: packageName,
                      org,
                      package_version_id: version.id,
                    });
                    deleted++;
                  } catch (err) {
                    failed++;
                    console.log(`  failed: ${err.message}`);
                  }
                }
              }
            }

            await core.summary
              .addHeading(`GHCR prune summary — ${packageName}`)
              .addList([
                `Mode: ${shouldDelete ? 'apply' : 'dry-run'}${pruneShaNow ? ' + prune_sha_now' : ''}`,
                `Package: ${org}/${packageName}`,
                `Scanned: ${scanned}`,
                `Deleted: ${deleted}`,
                `Skipped: ${skipped}`,
                `Failed: ${failed}`,
                `pr-* grace: ${process.env.PR_TAG_AGE_DAYS}d`,
                `untagged grace: ${process.env.UNTAGGED_AGE_DAYS}d`,
                `sha-* grace: ${process.env.SHA_TAG_AGE_DAYS}d`,
              ])
              .write();

            console.log(`\n[${packageName}] Scanned ${scanned} · Deleted ${deleted} · Skipped ${skipped} · Failed ${failed}`);
