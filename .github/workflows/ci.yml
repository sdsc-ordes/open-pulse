name: CI Baseline

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci.yml"
      - "**/*.md"
      - "**/*.json"
      - "**/*.yml"
      - "**/*.yaml"
      - "**/*.sh"
  push:
    branches:
      - main
      - "release/**"
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci.yml"
      - "**/*.md"
      - "**/*.json"
      - "**/*.yml"
      - "**/*.yaml"
      - "**/*.sh"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed scopes
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
      yaml: ${{ steps.filter.outputs.yaml }}
      markdown: ${{ steps.filter.outputs.markdown }}
      markdown_files: ${{ steps.filter.outputs.markdown_files }}
      shell: ${{ steps.filter.outputs.shell }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Evaluate changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          token: ""
          list-files: csv
          filters: |
            src:
              - "src/**"
              - "tests/**"
              - "pyproject.toml"
              - "uv.lock"
              - ".github/workflows/ci.yml"
            yaml:
              - "**/*.yml"
              - "**/*.yaml"
              - ".github/workflows/ci.yml"
            markdown:
              - "**/*.md"
            shell:
              - "**/*.sh"
              - ".github/workflows/ci.yml"

  pre-commit-quality-gates:
    name: Pre-commit quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Run pre-commit hooks
        run: pre-commit run --all-files

  python-lint-and-test:
    name: Python lint and tests (src)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.src == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --group dev --group test

      - name: Run Ruff
        run: uv run ruff check src/

      - name: Run pytest
        run: uv run pytest -q

  yaml-and-markdown-validation:
    name: YAML and Markdown validation
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.yaml == 'true' || needs.changes.outputs.markdown == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint YAML
        if: needs.changes.outputs.yaml == 'true'
        uses: ibiqlik/action-yamllint@v3
        with:
          config_file: .yamllint

      - name: Lint Markdown
        if: needs.changes.outputs.markdown == 'true'
        uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: ${{ needs.changes.outputs.markdown_files }}
          separator: ","

  shell-script-sanity:
    name: Shell script sanity
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck

      - name: Run ShellCheck
        run: |
          mapfile -t shell_files < <(git ls-files '*.sh')
          if [ "${#shell_files[@]}" -eq 0 ]; then
            echo "No shell scripts found."
            exit 0
          fi
          shellcheck "${shell_files[@]}"
