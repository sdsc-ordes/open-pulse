# open-pulse quest — Protein design tools (DRAFT, for review before running)
#
# 30-tool protein-design landscape → resolve to GitHub → crawl a few hops
# (incl. dependents) → fresh HYBRID GME (no cache, no timeout) → stream into
# the 2026-06/hybrid named graph. A GrimoireLab project "protein-design-tools"
# following the seeds is created separately via the hub /api/projects API
# (the built-in apply_grimoire_projects step is owner-grouped, not a single
# named project) — see the NOTE at the bottom.
#
# Run with:
#   open-pulse quest start --config config/quest.protein-design-tools.yml
#
# ── 30 tools → GitHub resolution (74 seeds total) ─────────────────────────
# 22 curated non-Rosetta tools + ProteinMPNN + all 52 RosettaCommons repos.
# Not seeded (no public repo):
#   • AbMPNN     — weights on Zenodo only; runs on dauparas/ProteinMPNN (seeded)
#   • ProteinCrow— FutureHouse agentic tool, no public repo found
#   • PyRosetta  — no standalone source repo (lives inside RosettaCommons/rosetta,
#                  seeded); RosettaCommons/PyRosetta.notebooks added below as the
#                  closest public artifact (flagged — drop if you want tools only).
# ESM2 + ESMFold collapse to facebookresearch/esm (deduped).

quest:
  name: protein-design-tools
  description: |
    Protein-design tool landscape (30 tools → 26 GitHub seeds), crawled a few
    hops incl. dependents, then a fresh no-cache HYBRID GME pipeline streamed
    into 2026-06/hybrid. For CHAOSS analysis over the protein-design-tools
    GrimoireLab project.

  retry:
    max_attempts: 1          # long no-timeout run; don't auto-retry the whole step
    backoff_seconds: 30

  logging:
    level: INFO
    file: logs/quest-protein-design-tools.log

  services:
    crawler:
      endpoint: "http://crawler-loop:8000"
      api_token_env: "CRAWLER_API_TOKEN"
    neo4j:
      endpoint: "bolt://neo4j-open-pulse:7687"
      auth_env: "NEO4J_AUTH"
    metadata_extractor:
      endpoint: "http://git-metadata-extractor:1234"
    sparql_store:
      endpoint: "http://oxigraph-open-pulse:7878"
      auth_env: "SPARQL_AUTH"

  steps:
    crawler:
      enabled: true
      use_graphql: true
      seeds:
        # ── 1. First-wave structure prediction ──
        - google-deepmind/alphafold              # AlphaFold 2
        - RosettaCommons/RoseTTAFold             # RoseTTAFold
        - aqlaboratory/openfold                  # OpenFold
        - HeliXonProtein/OmegaFold               # OmegaFold
        - sokrypton/ColabFold                    # ColabFold
        # ── 2. Frontier foundation models ──
        - google-deepmind/alphafold3             # AlphaFold 3
        - chaidiscovery/chai-lab                 # Chai-1
        - jwohlwend/boltz                        # Boltz-2 (shared Boltz-1/2 repo)
        - facebookresearch/esm                   # ESM2 + ESMFold (shared, archived)
        - evolutionaryscale/esm                  # ESM3
        - westlake-repl/SaProt                   # SAProt
        # ── 3. Generative protein design ──
        - RosettaCommons/RFdiffusion             # RFdiffusion
        - baker-laboratory/rf_diffusion_all_atom # RFdiffusion All-Atom
        - dauparas/ProteinMPNN                   # ProteinMPNN (+ AbMPNN runs on this)
        - dauparas/LigandMPNN                    # LigandMPNN
        - generatebio/chroma                     # Chroma
        - ProteinDesignLab/protpardelle          # Protpardelle
        - jasonkyuyim/se3_diffusion              # FrameDiff (repo = se3_diffusion)
        # ── 4. Workflows & pipelines ──
        - martinpacesa/BindCraft                 # BindCraft
        - sokrypton/ColabDesign                  # ColabDesign
        - NatLabRockies/EvoProtGrad              # EvoProtGrad (org renamed from NREL)
        - RosettaCommons/protein_generator       # ProteinGenerator
        - DunbrackLab/IPSAE                       # ipSAE pipeline
        # ── 5. Core scoring & infrastructure ──
        - RosettaCommons/rosetta                 # Rosetta (also covers PyRosetta)
        - biopython/biopython                    # Biopython
        - oxpig/ImmuneBuilder                    # ImmuneBuilder
        # ── flagged: PyRosetta public artifact (tutorials, not the tool) ──
        - RosettaCommons/PyRosetta.notebooks     # PyRosetta (closest public repo)
        # ── 6. RosettaCommons org — all remaining public repos ("add all of them") ──
        # ★-sorted (2026-06). RoseTTAFold / RFdiffusion / rosetta / protein_generator /
        # PyRosetta.notebooks are already seeded above. Lines marked VENDORED/infra/data
        # are third-party deps or non-tool repos — prune if you want tools only.
        - RosettaCommons/foundry                 # ★845
        - RosettaCommons/RFantibody              # ★503
        - RosettaCommons/RFdiffusion2            # ★426
        - RosettaCommons/atomworks               # ★425
        - RosettaCommons/binder                  # ★366  (pybind11 binding generator — infra)
        - RosettaCommons/RFDesign                # ★282
        - RosettaCommons/DeepAb                  # ★173
        - RosettaCommons/trRosetta2              # ★123
        - RosettaCommons/Rosetta-DL              # ★38
        - RosettaCommons/AF2_peptide_hallucination # ★30
        - RosettaCommons/FvHallucinator          # ★28
        - RosettaCommons/RFDpoly                 # ★26
        - RosettaCommons/demos                   # ★25
        - RosettaCommons/rosetta_clone_tools     # ★25  (infra)
        - RosettaCommons/frustraMPNN             # ★14
        - RosettaCommons/rc                      # ★12  (infra/CLI)
        - RosettaCommons/pyrosetta_viewer3d      # ★11
        - RosettaCommons/documentation           # ★9   (docs)
        - RosettaCommons/pybind11                # ★9   (VENDORED third-party — prune?)
        - RosettaCommons/pyrosetta_scripts       # ★9
        - RosettaCommons/RFjoint2                # ★9
        - RosettaCommons/tools                   # ★8   (infra)
        - RosettaCommons/pyrosettascripts_demo   # ★8
        - RosettaCommons/RFDiffusion2_all_the_code # ★8
        - RosettaCommons/rosetta_scripts_scripts # ★7
        - RosettaCommons/AbExpress               # ★6
        - RosettaCommons/bakerlab_dotfiles       # ★5   (dotfiles — prune?)
        - RosettaCommons/rdkit                   # ★4   (VENDORED third-party — prune?)
        - RosettaCommons/alphafold               # ★4   (fork)
        - RosettaCommons/bcl_rosetta             # ★4
        - RosettaCommons/pyrosetta_colab_setup   # ★3
        - RosettaCommons/jade2                   # ★3
        - RosettaCommons/privileged_residues     # ★2
        - RosettaCommons/tensorflow_graphs       # ★2
        - RosettaCommons/additional_protocol_data  # ★1  (data)
        - RosettaCommons/scientific_benchmark_data # ★1  (data)
        - RosettaCommons/AutoRotLib              # ★1
        - RosettaCommons/libzmq                  # ★0   (VENDORED third-party — prune?)
        - RosettaCommons/mmtf-cpp                # ★0   (VENDORED third-party — prune?)
        - RosettaCommons/boost_lexical_cast      # ★0   (VENDORED boost — prune?)
        - RosettaCommons/boost_integer           # ★0   (VENDORED boost — prune?)
        - RosettaCommons/boost_multi_index       # ★0   (VENDORED boost — prune?)
        - RosettaCommons/chimerax-rosetta-server # ★0
        - RosettaCommons/pyrosetta-extras        # ★0
        - RosettaCommons/HBDesigner              # ★0
        - RosettaCommons/huggingface_datasets    # ★0   (data)
        - RosettaCommons/.github                 # ★0   (org meta — prune?)
      max_rounds: 2                  # a few hops: seeds + deps/dependents/contributors.
                                     # dependents only materialise at rounds>=2.
      crawl_dependencies: true       # software-reuse edges
      crawl_dependents: true         # downstream adoption
      crawl_issues: true             # issue authors/commenters → community graph
      crawl_prs: true                # PR authors/commenters/reviewers → community graph
      issue_max: 100                 # HARD MAX. GitHub GraphQL caps `first:` at 100 and
                                     # the crawler fetches a single page (no pagination),
                                     # so 100/repo is the ceiling — "uncapped" isn't
                                     # supported here. Most repos in this set have <100
                                     # issues so this is effectively complete.
      pr_max: 100                    # HARD MAX (same first:100 single-page limit)
      min_stars: 0
      max_dependents: null           # UNCAPPED — every dependent (can be huge for
                                     # alphafold/biopython; this is the test the user wants)
      max_contributors: null         # crawler default cap (~10)
      output_dir: .quest-artifacts/protein-design-tools
      output_filename: crawler-graph.json
      poll_interval_seconds: 5.0
      timeout_seconds: 0             # 0 = wait indefinitely (no client-side timeout)

    frontier_extend:
      enabled: false

    neo4j_upload:
      enabled: true
      input_dir: .quest-artifacts/protein-design-tools
      input_filename: crawler-graph.json

    metadata_extractor:
      enabled: true
      mode: v2
      v2_agent_runtime: hybrid       # LLM refiners + the gme-internal signals
      include_internal_fields: true  # keep gme-internal:* (releases, packages,
                                     # test_coverage, docker, badges, …)
      extract_users: true            # also GME-extract the crawled users (rich
                                     # person profiles, not just contributor nodes)
      extract_orgs: true             # also GME-extract the crawled orgs
      force_refresh: true            # NO cache — re-fetch + re-extract fresh
      skip_existing: false           # write fresh even if a file exists
      max_workers: 4                 # in-flight v2 submits. GME caps concurrency at
                                     # V2_MAX_CONCURRENT_AGENTS=6 in one worker;
                                     # keep modest so 6×(2-5GB) doesn't blow the
                                     # 6g mem_limit. Lower to 2 if you see OOM.
      v2_poll_interval_seconds: 3.0
      v2_timeout_seconds: 0          # 0 = wait indefinitely (hybrid is slow)
      # Stream each repo's JSON-LD into Oxigraph as it finishes.
      stream_to_sparql: true
      stream_named_graph: "https://open-pulse.epfl.ch/graph/2026-06/hybrid"
      publish_to_default: true       # ALSO write the default graph so the hub
                                     # CHAOSS API (queries default) surfaces these
                                     # repos. Set false to isolate to 2026-06/hybrid
                                     # only (then the hub won't show their SPARQL
                                     # metrics). ← decision flagged in the summary.
      input_dir: .quest-artifacts/protein-design-tools
      input_filename: crawler-graph.json
      output_dir: .quest-artifacts/protein-design-tools/metadata-json

    sparql_upload:
      enabled: true                  # safety net (streaming already loads it)
      input_dir: .quest-artifacts/protein-design-tools/metadata-json
      named_graph: "https://open-pulse.epfl.ch/graph/2026-06/hybrid"

    # Owner-grouped projects.json — NOT what we want (one project per owner).
    apply_grimoire_projects:
      enabled: false

# ── NOTE: the GrimoireLab "protein-design-tools" project ───────────────────
# The single named project that *follows all 74 seed repos* is created via the
# hub API (the quest's apply step only does owner-grouping):
#
#   AUTH='admin:<HUB_AUTH>'                       # admin (write) credential
#   # 1) build the envelope (title → slug "protein-design-tools", git = seeds)
#   curl -s -u "$AUTH" -H 'content-type: application/json' \
#     https://openpulse.epfl.ch/api/projects/build \
#     -d '{"title":"protein-design-tools","repos":[
#          "https://github.com/google-deepmind/alphafold.git", ... all 26/27 .git ...]}'
#   # 2) apply it (merges into the live projects.json → Mordred follows them)
#   curl -s -u "$AUTH" -H 'content-type: application/json' \
#     https://openpulse.epfl.ch/api/projects/apply \
#     -d '{"projects_json": <envelope from step 1>}'
#
# I generate the exact 74-repo .git list and run these on launch.
# Scope confirmed: the project follows ALL 74 seed repos (not crawl-discovered).
