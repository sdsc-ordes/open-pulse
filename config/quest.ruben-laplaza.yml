# open-pulse quest — Rubén Laplaza ego-network crawl
#
# Person-centric crawl built on the develop crawler (schema v3, "more node
# types": Person / ORCID / Organization seeds in addition to repos). Seeds the
# crawler from three angles for the same researcher so the identity is resolved
# across platforms, then expands the collaboration + software graph 3 rounds out:
#   - GitHub user   : https://github.com/rlaplaza   (deep expansion, 3 rounds)
#   - ORCID         : https://orcid.org/0000-0001-6315-4398
#   - Person name   : Rubén Laplaza
#
# Seed typing is CRAWLER-SIDE: the crawler classifies each seed string by shape
# (github.com URL → GitHub user/repo, orcid.org URL → ORCID person, bare string
# → person name). The pipeline forwards `seeds` verbatim to the crawler's
# CrawlRequest, so no seed-type field is needed here.
#
# Pass with::
#
#     open-pulse quest start --config config/quest.ruben-laplaza.yml
#
# NOTE: 3 rounds with contributor + issue + PR expansion around an active
# researcher can fan out into thousands of nodes. `max_contributors` caps the
# per-repo contributor expansion to keep round-3 bounded. Recommend a
# `max_rounds: 1` dry run first to confirm seed classification + scale.

quest:
  name: ruben-laplaza
  description: |
    3-round ego-network crawl of Rubén Laplaza (github rlaplaza /
    ORCID 0000-0001-6315-4398), capturing his repositories, collaborators
    (contributors + issue/PR participants), their organizations, and software
    dependencies, then GME metadata extraction → SPARQL upload to an isolated
    named graph. crawler → neo4j_upload → metadata_extractor (v2) → sparql_upload.

  retry:
    max_attempts: 2
    backoff_seconds: 30

  logging:
    level: INFO
    file: logs/quest-ruben-laplaza.log

  # Container-network endpoints (runs inside open-pulse-cli on the
  # open-pulse-stack_default network). crawler-loop = the develop crawler
  # (schema v3) matching the neo4j uploader's subkind/platform/URL handling.
  services:
    crawler:
      endpoint: "http://crawler-loop:8000"
      api_token_env: "CRAWLER_API_TOKEN"
    neo4j:
      endpoint: "bolt://neo4j-open-pulse:7687"
      auth_env: "NEO4J_AUTH"
    metadata_extractor:
      endpoint: "http://git-metadata-extractor:1234"
    sparql_store:
      endpoint: "http://oxigraph-open-pulse:7878"
      auth_env: "SPARQL_AUTH"

  steps:
    crawler:
      enabled: true
      use_graphql: true
      # GitHub-only seed: the quest pipeline drives the crawler's v1 API, which
      # accepts github.com seeds only ("v1 supports github.com seeds only; use
      # /api/v2"). The ORCID (https://orcid.org/0000-0001-6315-4398) and name
      # ("Rubén Laplaza") seeds need the crawler's /api/v2 endpoint, which the
      # pipeline does not yet drive — add them once v2 support lands in
      # open_pulse/services/crawler.py. The 3-round github expansion still
      # produces user / org / repo nodes for his collaboration network.
      seeds:
        - https://github.com/rlaplaza            # GitHub user (deep 3-round expansion)
      max_rounds: 3                  # "github with 3 steps"
      crawl_dependencies: true       # software his repos reuse
      crawl_dependents: false        # GitHub dependents are sparse/noisy for research repos
      crawl_issues: true             # issue authors + commenters → collaborators
      crawl_prs: true                # PR authors + reviewers → collaborators
      issue_max: 100
      pr_max: 100
      min_stars: 0
      max_dependents: null
      # Cap per-repo contributor expansion so a mega-repo in the frontier
      # doesn't blow up round-3 fan-out. Raise/lower to trade breadth vs cost.
      max_contributors: 40
      output_dir: .quest-artifacts/crawler-json-ruben-laplaza
      output_filename: crawler-graph.json
      poll_interval_seconds: 5.0
      timeout_seconds: 7200.0

    frontier_extend:
      enabled: false

    neo4j_upload:
      enabled: true
      input_dir: .quest-artifacts/crawler-json-ruben-laplaza
      input_filename: crawler-graph.json

    metadata_extractor:
      enabled: true
      mode: v2
      v2_agent_runtime: rule_based   # deterministic + fast; set `hybrid` for ROR/ORCID/LLM enrichment
      max_workers: 1                 # GME runs EXTRACTOR_WORKERS=1; >1 only thrashes it
      v2_poll_interval_seconds: 2.0
      v2_timeout_seconds: 600.0
      input_dir: .quest-artifacts/crawler-json-ruben-laplaza
      input_filename: crawler-graph.json
      output_dir: .quest-artifacts/metadata-json-ruben-laplaza
      skip_existing: true
      force_refresh: false
      max_repos: 0                   # 0 = all repos in the graph

    sparql_upload:
      enabled: true
      input_dir: .quest-artifacts/metadata-json-ruben-laplaza
      named_graph: "https://open-pulse.epfl.ch/graph/ruben-laplaza"  # isolate this study
