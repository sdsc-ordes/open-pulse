# open-pulse quest — EPFL ENAC, 3 hops, HYBRID GME, no timeouts
#
# Everything connected to EPFL-ENAC within 3 crawl hops (org → repos →
# contributors+deps → their repos+contributors+deps), then HYBRID (LLM) GME
# extraction with NO timeouts. Big run by design. force_refresh bypasses the
# GME cache so every entity is re-extracted with the hybrid runtime.
#
#     open-pulse quest start --config config/quest.epfl-enac-3hop.yml

quest:
  name: epfl-enac-3hop
  description: |
    EPFL ENAC 3-hop neighbourhood — repos, contributors, orgs, dependencies —
    crawled 3 rounds, then HYBRID GME metadata extraction (no timeouts) → SPARQL.

  retry:
    max_attempts: 2
    backoff_seconds: 30

  logging:
    level: INFO
    file: logs/quest-epfl-enac-3hop.log

  services:
    crawler:
      endpoint: "http://crawler-loop:8000"
      api_token_env: "CRAWLER_API_TOKEN"
    neo4j:
      endpoint: "bolt://neo4j-open-pulse:7687"
      auth_env: "NEO4J_AUTH"
    metadata_extractor:
      endpoint: "http://git-metadata-extractor:1234"
    sparql_store:
      endpoint: "http://oxigraph-open-pulse:7878"
      auth_env: "SPARQL_AUTH"

  steps:
    crawler:
      enabled: true
      use_graphql: true
      seeds:
        - https://github.com/EPFL-ENAC
      max_rounds: 3                  # 3 hops
      crawl_dependencies: true
      crawl_dependents: false
      crawl_issues: false
      crawl_prs: false
      min_stars: 0
      max_contributors: 40           # cap per-repo contributor fan-out (bounds hop-3)
      output_dir: .quest-artifacts/crawler-json-epfl-enac-3hop
      output_filename: crawler-graph.json
      poll_interval_seconds: 5.0
      timeout_seconds: 0             # no client-side crawl timeout

    frontier_extend:
      enabled: false

    neo4j_upload:
      enabled: true
      input_dir: .quest-artifacts/crawler-json-epfl-enac-3hop
      input_filename: crawler-graph.json

    metadata_extractor:
      enabled: true
      mode: v2
      v2_agent_runtime: hybrid       # LLM enrichment (default for this run)
      max_workers: 1
      v2_poll_interval_seconds: 2.0
      v2_timeout_seconds: 0          # no per-repo GME timeout (wait indefinitely)
      input_dir: .quest-artifacts/crawler-json-epfl-enac-3hop
      input_filename: crawler-graph.json
      output_dir: .quest-artifacts/metadata-json-epfl-enac-3hop
      skip_existing: false
      force_refresh: true            # re-extract with hybrid, bypass cache
      max_repos: 0

    sparql_upload:
      enabled: true
      input_dir: .quest-artifacts/metadata-json-epfl-enac-3hop
      named_graph: "https://open-pulse.epfl.ch/graph/epfl-enac-3hop"
