# open-pulse quest — EPFL ENAC open-source tools (fresh, no-cache GME)
#
# Crawls the EPFL-ENAC GitHub org (167 repos) → repos (tools) → contributors +
# dependencies, then a CACHE-FREE GME metadata extraction (cache cleared
# beforehand + force_refresh) → SPARQL upload. Re-resolves people/orgs against
# the freshly re-ingested GME indices (infoscience, epfl_graph, ror, orcid, …).
#
#     open-pulse quest start --config config/quest.epfl-enac.yml

quest:
  name: epfl-enac
  description: |
    EPFL ENAC ecosystem — repos (tools), contributors, orgs and dependencies,
    2-round github crawl + fresh (no-cache, force_refresh) GME extraction →
    SPARQL. crawler → neo4j_upload → metadata_extractor → sparql_upload.

  retry:
    max_attempts: 2
    backoff_seconds: 30

  logging:
    level: INFO
    file: logs/quest-epfl-enac.log

  services:
    crawler:
      endpoint: "http://crawler-loop:8000"
      api_token_env: "CRAWLER_API_TOKEN"
    neo4j:
      endpoint: "bolt://neo4j-open-pulse:7687"
      auth_env: "NEO4J_AUTH"
    metadata_extractor:
      endpoint: "http://git-metadata-extractor:1234"
    sparql_store:
      endpoint: "http://oxigraph-open-pulse:7878"
      auth_env: "SPARQL_AUTH"

  steps:
    crawler:
      enabled: true
      use_graphql: true
      seeds:
        - https://github.com/EPFL-ENAC
      max_rounds: 2                  # org → repos (tools) → contributors + deps
      crawl_dependencies: true
      crawl_dependents: false
      crawl_issues: false
      crawl_prs: false
      min_stars: 0
      max_contributors: 40
      output_dir: .quest-artifacts/crawler-json-epfl-enac
      output_filename: crawler-graph.json
      poll_interval_seconds: 5.0
      timeout_seconds: 0

    frontier_extend:
      enabled: false

    neo4j_upload:
      enabled: true
      input_dir: .quest-artifacts/crawler-json-epfl-enac
      input_filename: crawler-graph.json

    metadata_extractor:
      enabled: true
      mode: v2
      v2_agent_runtime: rule_based
      max_workers: 1
      v2_poll_interval_seconds: 2.0
      v2_timeout_seconds: 600.0
      input_dir: .quest-artifacts/crawler-json-epfl-enac
      input_filename: crawler-graph.json
      output_dir: .quest-artifacts/metadata-json-epfl-enac
      skip_existing: false           # fresh: don't skip
      force_refresh: true            # fresh: bypass GME cache (already cleared too)
      max_repos: 0

    sparql_upload:
      enabled: true
      input_dir: .quest-artifacts/metadata-json-epfl-enac
      named_graph: "https://open-pulse.epfl.ch/graph/epfl-enac"
