[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "openpulse-analysis"
version = "0.1.0"
description = "Open Pulse analysis toolkit package."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Open Pulse Team" },
]
dependencies = []

[project.scripts]
openpulse-analysis = "openpulse_analysis.cli:main"

[dependency-groups]
dev = [
  "ruff>=0.9.0",
]
test = [
  "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/openpulse_analysis"]
